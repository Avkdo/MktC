name: Warm Shares Outstanding

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch: {}

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch shares outstanding and push to Worker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_SECRET: ${{ secrets.WORKER_ADMIN_SECRET }}
        run: node scripts/fetch-shares-outstanding.js
